description: We are exporting the 12 dendritic recordings spanning lengths and imaging
  sampling rates from 4 mice expressing the voltage sensor JEDI3hyp. This dataset
  contains two-photon mesoscope recordings spanning multiple focal planes traversing
  one to two Layer 5 soma and their corresponding apical dendrites in addition to
  aligned locomotion and pupil data.
